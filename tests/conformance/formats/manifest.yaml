# The conformance-corpus manifest: every corpus file with its expected
# outcome, and the refusal-category registry the outcomes reference.
#
# BINDING vs INFORMATIONAL (the family's published-but-unconsumed-truth
# remedy): for every case, the outcome (loads / refused) and — for
# refusals — the category are BINDING on every consuming framework; the
# wording of refusal messages is INFORMATIONAL (each framework speaks its
# own author vocabulary). A consumer's format-conformance run diffs the
# assertions it actually made against these binding obligations, so
# selective assertion fails the build.
#
# Categories carry their mandating spec section (the prose format
# specifications in the family's internal requirements catalog) and a
# refusal classification consumed by scripts/validate_formats.R:
#   structural — the published JSON Schema refuses the file
#   semantic   — the schema (deliberately) accepts it; the refusal is the
#                consuming loader's obligation
#
# ENVIRONMENT: corpus outcomes hold under an empty user-registration
# environment plus each case's requires: list — registered artefacts a
# consumer provisions before loading that case (stepper:<name>,
# scorer:<name>, transform:<name>, check:<name>, type:<name>). A named
# requirement mirrors the reader's own registration idiom; the corpus
# never prescribes host-language code.

