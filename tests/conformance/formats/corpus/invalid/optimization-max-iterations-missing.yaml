# REFUSED: max-iterations: is required — the cap always bounds the
# spend (Part I, optimizations).
format: mavai-services/1
services:
  basket-builder:
    type: language-model
    configuration:
      system-prompt: "You build baskets."
      temperature: 0.2
    optimizations:
      - stepper: linear-sweep
        stepper-config: { key: temperature, step: 0.1, stop: 1.0 }
