# REFUSED: a zero step re-measures one configuration forever (§II.9).
format: mavai-services/1
services:
  greeter:
    type: language-model
    configuration:
      system-prompt: "You are a polite greeter."
      temperature: 0.2
    optimizations:
      - stepper: linear-sweep
        stepper-config: { key: temperature, step: 0, stop: 1.0 }
        max-iterations: 5
