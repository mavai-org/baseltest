# REFUSED (semantic): an initial: overlay that merely restates the
# baseline changes nothing — iteration 0 is the baseline by default
# (Part I, optimizations).
format: mavai-services/1
services:
  basket-builder:
    type: language-model
    configuration:
      system-prompt: "You build baskets."
      temperature: 0.2
    optimizations:
      - stepper: linear-sweep
        stepper-config: { key: temperature, step: 0.1, stop: 1.0 }
        initial: { temperature: 0.2 }
        max-iterations: 5
