# REFUSED: refining-grid's min-step must be at most step (§II.9). A
# cross-key rule, so the reader refuses it at load; the schema cannot.
format: mavai-services/1
services:
  greeter:
    type: language-model
    configuration:
      system-prompt: "You are a polite greeter."
      temperature: 0.2
    optimizations:
      - stepper: refining-grid
        stepper-config: { key: temperature, lo: 0.0, hi: 1.0, step: 0.1, min-step: 0.25 }
        max-iterations: 20
