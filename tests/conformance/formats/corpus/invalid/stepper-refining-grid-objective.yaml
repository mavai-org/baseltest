# REFUSED: refining-grid decides on the all-criteria pass rate, so it
# cannot minimise (§II.9).
format: mavai-services/1
services:
  greeter:
    type: language-model
    configuration:
      system-prompt: "You are a polite greeter."
      temperature: 0.2
    optimizations:
      - stepper: refining-grid
        stepper-config: { key: temperature, lo: 0.0, hi: 1.0, step: 0.25, min-step: 0.05 }
        objective: minimize
        max-iterations: 20
